<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posiciones y Cruces - Liga Rivadaviense</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #0f172a;
      --primary-light: #1e3a8a;
      --accent: #2563eb;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }
    .container { max-width: 1120px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #ffffff;
      padding: 24px 20px;
      border-radius: 12px 12px 0 0;
      text-align: center;
    }
    header h1 { font-size: 1.55rem; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 0.9rem; color: #cbd5e1; }
    .controls-panel {
      background-color: #ffffff;
      padding: 16px;
      border: 1px solid var(--border);
      border-top: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-group-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .division-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .tab-btn {
      padding: 10px 12px;
      border: 1px solid var(--border);
      background-color: #f8fafc;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active { background-color: var(--primary); color: #ffffff; border-color: var(--primary); }
    .sub-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .sub-btn {
      padding: 8px 16px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .sub-btn.active { background-color: var(--accent); color: #ffffff; border-color: var(--accent); }
    .board-card {
      background-color: var(--card-bg);
      border-radius: 0 0 12px 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-top: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .current-title { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    iframe { width: 100%; min-width: 680px; height: 540px; border: none; display: block; }
    footer { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-muted); }
    @media (max-width: 640px) {
      body { padding: 8px; }
      header h1 { font-size: 1.25rem; }
      .division-tabs { grid-template-columns: repeat(2, 1fr); }
      .board-card { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tablas de Posiciones y Cruces</h1>
      <p>Liga Rivadaviense de Fútbol • Clausura 2026</p>
    </header>
    <section class="controls-panel">
      <div>
        <div class="btn-group-label">1. Seleccioná la División</div>
        <div class="division-tabs" id="divisionTabs">
          <button class="tab-btn active" data-div="primeraA">Primera A</button>
          <button class="tab-btn" data-div="primeraB">Primera B</button>
          <button class="tab-btn" data-div="reservaA">Reserva A</button>
          <button class="tab-btn" data-div="reservaB">Reserva B</button>
        </div>
      </div>
      <div>
        <div class="btn-group-label">2. Seleccioná Tabla o Cruces</div>
        <div class="sub-tabs" id="subTabs"></div>
      </div>
    </section>
    <main class="board-card">
      <div class="status-bar">
        <span class="current-title" id="currentViewTitle">Primera A — Tabla Zona A</span>
        <span>Deslizá lateralmente en celular &rarr;</span>
      </div>
      <div class="table-wrapper">
        <iframe id="excelFrame" scrolling="no"></iframe>
      </div>
    </main>
    <footer>
      <p>Resultados oficiales sujetos a homologación del Tribunal de Disciplina.</p>
    </footer>
  </div>

  <script>
    const BASE_URL = "https://1drv.ms/x/c/b90d047e400182f5/IQTXrfcP4AjlRqM54eRwl4MLAcgV_COvlDoyNlF1P03_2bk?em=2&wdAllowInteractivity=False&Item=";
    const PARAMS = "&wdHideGridlines=True&wdHideHeaders=True";

    const DATA_VIEWS = {
      primeraA: [
        { label: "Tabla Zona A", sheet: "TABLA PRIMERA A ZONA A", range: "A1:L17", height: 530, minWidth: 760 },
        { label: "Tabla Zona B", sheet: "TABLA PRIMERA A ZONA B", range: "A1:L17", height: 530, minWidth: 760 },
        { label: "Cruces (Playoffs)", sheet: "CRUCES PRIMERA A", range: "A1:S29", height: 800, minWidth: 1050 }
      ],
      primeraB: [
        { label: "Tabla General", sheet: "TABLA PRIMERA B", range: "A1:L18", height: 610, minWidth: 760 },
        { label: "Cruces", sheet: "CRUCES PRIMERA B", range: "A1:G16", height: 560, minWidth: 1050 }
      ],
      reservaA: [
        { label: "Tabla Zona A", sheet: "TABLA RESERVA A ZONA A", range: "A1:L15", height: 510, minWidth: 760 },
        { label: "Tabla Zona B", sheet: "TABLA RESERVA A ZONA B", range: "A1:L15", height: 510, minWidth: 760 },
        { label: "Cruces (Playoffs)", sheet: "CRUCES RESERVA A", range: "A1:S29", height: 800, minWidth: 1050 }
      ],
      reservaB: [
        { label: "Tabla General", sheet: "TABLA RESERVA B", range: "A1:K17", height: 610, minWidth: 760 },
        { label: "Cruces", sheet: "CRUCES RESERVA B", range: "A1:G16", height: 560, minWidth: 1050 }
      ]
    };

    const DIVISION_NAMES = {
      primeraA: "Primera A",
      primeraB: "Primera B",
      reservaA: "Reserva A",
      reservaB: "Reserva B"
    };

    const divisionTabs = document.getElementById("divisionTabs");
    const subTabs = document.getElementById("subTabs");
    const excelFrame = document.getElementById("excelFrame");
    const currentViewTitle = document.getElementById("currentViewTitle");

    function loadSheet(divKey, index) {
      const item = DATA_VIEWS[divKey][index];
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.div === divKey));
      document.querySelectorAll(".sub-btn").forEach((btn, idx) => btn.classList.toggle("active", idx === index));

      currentViewTitle.textContent = `${DIVISION_NAMES[divKey]} — ${item.label}`;
      excelFrame.style.height = item.height + "px";
      excelFrame.style.minWidth = item.minWidth + "px";

      const encodedSheet = encodeURIComponent(item.sheet);
      excelFrame.src = `${BASE_URL}'${encodedSheet}'!${item.range}${PARAMS}`;
    }

    function renderSubButtons(divKey) {
      subTabs.innerHTML = "";
      DATA_VIEWS[divKey].forEach((view, idx) => {
        const btn = document.createElement("button");
        btn.className = "sub-btn" + (idx === 0 ? " active" : "");
        btn.textContent = view.label;
        btn.addEventListener("click", () => loadSheet(divKey, idx));
        subTabs.appendChild(btn);
      });
    }

    divisionTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      renderSubButtons(btn.dataset.div);
      loadSheet(btn.dataset.div, 0);
    });

    renderSubButtons("primeraA");
    loadSheet("primeraA", 0);
  </script>
</body>
</html>
