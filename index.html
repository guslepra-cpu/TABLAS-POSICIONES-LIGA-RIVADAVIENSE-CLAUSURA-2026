<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posiciones y Cruces - Liga Rivadaviense</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #0f172a;
      --primary-light: #1e3a8a;
      --accent: #2563eb;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #ffffff;
      padding: 20px 16px;
      border-radius: 12px 12px 0 0;
      text-align: center;
    }

    header h1 { font-size: 1.45rem; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 0.88rem; color: #cbd5e1; }

    .controls-panel {
      background-color: #ffffff;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-top: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-group-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .division-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tab-btn {
      padding: 10px 8px;
      border: 1px solid var(--border);
      background-color: #f8fafc;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.15s;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .sub-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .sub-btn {
      padding: 7px 14px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.84rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.15s;
    }

    .sub-btn.active {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .board-card {
      background-color: var(--card-bg);
      border-radius: 0 0 12px 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-top: none;
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.06);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .current-title {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .zoom-btn {
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      cursor: pointer;
    }

    .pdf-btn {
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #ffffff;
      background: #16a34a;
      border: 1px solid #15803d;
      border-radius: 6px;
      cursor: pointer;
    }

    .pdf-btn:hover {
      background: #15803d;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: hidden;
      background: #ffffff;
    }

    .table-wrapper.scroll-mode {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .scale-box {
      position: relative;
      margin: 0 auto;
      overflow: hidden;
    }

    iframe {
      border: none;
      display: block;
      transform-origin: top left;
    }

    footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      body { padding: 6px; }
      header { padding: 16px 12px; }
      header h1 { font-size: 1.2rem; }
      .division-tabs { grid-template-columns: repeat(2, 1fr); }
      .board-card { padding: 8px; }
    }

    /* Estilos limpios exclusivos al descargar o imprimir en PDF */
    @media print {
      @page {
        size: landscape;
        margin: 8mm;
      }
      body {
        background: #ffffff;
        padding: 0;
      }
      .controls-panel,
      .action-buttons {
        display: none !important;
      }
      header {
        background: #0f172a !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        padding: 12px;
        border-radius: 6px 6px 0 0;
      }
      .board-card {
        border: none;
        box-shadow: none;
        padding: 8px 0;
      }
      .table-wrapper,
      .scale-box {
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }
      iframe {
        transform: none !important;
        width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tablas de Posiciones y Cruces</h1>
      <p>Liga Rivadaviense de Fútbol • Clausura 2026</p>
    </header>

    <section class="controls-panel">
      <div>
        <div class="btn-group-label">1. Seleccioná la División</div>
        <div class="division-tabs" id="divisionTabs">
          <button class="tab-btn active" data-div="primeraA">Primera A</button>
          <button class="tab-btn" data-div="primeraB">Primera B</button>
          <button class="tab-btn" data-div="reservaA">Reserva A</button>
          <button class="tab-btn" data-div="reservaB">Reserva B</button>
        </div>
      </div>

      <div>
        <div class="btn-group-label">2. Seleccioná Tabla o Cruces</div>
        <div class="sub-tabs" id="subTabs"></div>
      </div>
    </section>

    <main class="board-card">
      <div class="status-bar">
        <span class="current-title" id="currentViewTitle">Primera A — Tabla Zona A</span>
        <div class="action-buttons">
          <button class="zoom-btn" id="zoomToggleBtn">Ampliar tamaño (100%)</button>
          <button class="pdf-btn" id="pdfDownloadBtn">Descargar PDF</button>
        </div>
      </div>

      <div class="table-wrapper" id="tableWrapper">
        <div class="scale-box" id="scaleBox">
          <iframe id="excelFrame" scrolling="no"></iframe>
        </div>
      </div>
    </main>

    <footer>
      <p>Resultados oficiales sujetos a homologación del Tribunal de Disciplina.</p>
    </footer>
  </div>

  <script>
    const BASE_URL = "https://1drv.ms/x/c/b90d047e400182f5/IQTXrfcP4AjlRqM54eRwl4MLAcgV_COvlDoyNlF1P03_2bk?em=2&wdAllowInteractivity=False&Item=";
    const PARAMS = "&wdHideGridlines=True&wdHideHeaders=True";

    const DATA_VIEWS = {
      primeraA: [
        { label: "Tabla Zona A", sheet: "TABLA PRIMERA A ZONA A", range: "A1:L18", width: 840, height: 550 },
        { label: "Tabla Zona B", sheet: "TABLA PRIMERA A ZONA B", range: "A1:L18", width: 840, height: 550 },
        { label: "Cruces (Playoffs)", sheet: "CRUCES PRIMERA A", range: "A1:T30", width: 1180, height: 830 }
      ],
      primeraB: [
        { label: "Tabla General", sheet: "TABLA PRIMERA B", range: "A1:L19", width: 840, height: 630 },
        { label: "Cruces", sheet: "CRUCES PRIMERA B", range: "A1:H17", width: 1080, height: 580 }
      ],
      reservaA: [
        { label: "Tabla Zona A", sheet: "TABLA RESERVA A ZONA A", range: "A1:L16", width: 840, height: 520 },
        { label: "Tabla Zona B", sheet: "TABLA RESERVA A ZONA B", range: "A1:L16", width: 840, height: 520 },
        { label: "Cruces (Playoffs)", sheet: "CRUCES RESERVA A", range: "A1:T30", width: 1180, height: 830 }
      ],
      reservaB: [
        { label: "Tabla General", sheet: "TABLA RESERVA B", range: "A1:K18", width: 820, height: 630 },
        { label: "Cruces", sheet: "CRUCES RESERVA B", range: "A1:H17", width: 1080, height: 580 }
      ]
    };

    const DIVISION_NAMES = {
      primeraA: "Primera A",
      primeraB: "Primera B",
      reservaA: "Reserva A",
      reservaB: "Reserva B"
    };

    const divisionTabs = document.getElementById("divisionTabs");
    const subTabs = document.getElementById("subTabs");
    const tableWrapper = document.getElementById("tableWrapper");
    const scaleBox = document.getElementById("scaleBox");
    const excelFrame = document.getElementById("excelFrame");
    const currentViewTitle = document.getElementById("currentViewTitle");
    const zoomToggleBtn = document.getElementById("zoomToggleBtn");
    const pdfDownloadBtn = document.getElementById("pdfDownloadBtn");

    let currentDiv = "primeraA";
    let currentIndex = 0;
    let fitToScreen = true;

    function applyResponsiveScale() {
      const item = DATA_VIEWS[currentDiv][currentIndex];
      const availableWidth = tableWrapper.clientWidth;

      excelFrame.style.width = item.width + "px";
      excelFrame.style.height = item.height + "px";

      if (fitToScreen && availableWidth < item.width) {
        const scale = availableWidth / item.width;
        excelFrame.style.transform = `scale(${scale})`;
        scaleBox.style.width = availableWidth + "px";
        scaleBox.style.height = Math.ceil(item.height * scale) + "px";
        tableWrapper.classList.remove("scroll-mode");
        zoomToggleBtn.textContent = "Ampliar tamaño (100%)";
      } else {
        excelFrame.style.transform = "none";
        scaleBox.style.width = item.width + "px";
        scaleBox.style.height = item.height + "px";
        tableWrapper.classList.add("scroll-mode");
        zoomToggleBtn.textContent = availableWidth < item.width ? "Ajustar a pantalla" : "Vista completa";
      }
    }

    function loadSheet(divKey, index) {
      currentDiv = divKey;
      currentIndex = index;
      const item = DATA_VIEWS[divKey][index];

      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.div === divKey));
      document.querySelectorAll(".sub-btn").forEach((btn, idx) => btn.classList.toggle("active", idx === index));

      const fullTitle = `${DIVISION_NAMES[divKey]} — ${item.label}`;
      currentViewTitle.textContent = fullTitle;
      document.title = `${fullTitle} - Liga Rivadaviense`;
      applyResponsiveScale();

      const encodedSheet = encodeURIComponent(item.sheet);
      excelFrame.src = `${BASE_URL}'${encodedSheet}'!${item.range}${PARAMS}`;
    }

    function renderSubButtons(divKey) {
      subTabs.innerHTML = "";
      DATA_VIEWS[divKey].forEach((view, idx) => {
        const btn = document.createElement("button");
        btn.className = "sub-btn" + (idx === 0 ? " active" : "");
        btn.textContent = view.label;
        btn.addEventListener("click", () => loadSheet(divKey, idx));
        subTabs.appendChild(btn);
      });
    }

    divisionTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      renderSubButtons(btn.dataset.div);
      loadSheet(btn.dataset.div, 0);
    });

    zoomToggleBtn.addEventListener("click", () => {
      fitToScreen = !fitToScreen;
      applyResponsiveScale();
    });

    pdfDownloadBtn.addEventListener("click", () => {
      window.print();
    });

    window.addEventListener("resize", applyResponsiveScale);

    renderSubButtons("primeraA");
    loadSheet("primeraA", 0);
  </script>
</body>
</html>
