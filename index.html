<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posiciones y Cruces - Liga Rivadaviense</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #0f172a;
      --primary-light: #1e3a8a;
      --accent: #2563eb;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #ffffff;
      padding: 24px 20px;
      border-radius: 12px 12px 0 0;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .controls-panel {
      background-color: #ffffff;
      padding: 16px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-group-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .division-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tab-btn {
      padding: 10px 12px;
      border: 1px solid var(--border);
      background-color: #f8fafc;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
    }

    .tab-btn:hover {
      background-color: #eff6ff;
      border-color: #93c5fd;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.2);
    }

    .sub-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .sub-btn {
      padding: 8px 16px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .sub-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .sub-btn.active {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .board-card {
      background-color: var(--card-bg);
      border-radius: 0 0 12px 12px;
      padding: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      border-top: none;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .current-title {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #16a34a;
    }

    .dot {
      height: 8px;
      width: 8px;
      background-color: #16a34a;
      border-radius: 50%;
      display: inline-block;
    }

    .table-wrapper {
      position: relative;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #f1f5f9;
    }

    .loader {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--accent);
      font-size: 0.95rem;
      z-index: 5;
      transition: opacity 0.2s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    iframe {
      width: 100%;
      min-width: 680px;
      height: 540px;
      border: none;
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      body { padding: 8px; }
      header { padding: 18px 14px; }
      header h1 { font-size: 1.25rem; }
      .division-tabs { grid-template-columns: repeat(2, 1fr); }
      .board-card { padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Tablas de Posiciones y Cruces</h1>
      <p>Liga Rivadaviense de Fútbol • Clausura 2026</p>
    </header>

    <section class="controls-panel">
      <div>
        <div class="btn-group-label">1. Seleccioná la División</div>
        <div class="division-tabs" id="divisionTabs">
          <button class="tab-btn active" data-div="primeraA">Primera A</button>
          <button class="tab-btn" data-div="primeraB">Primera B</button>
          <button class="tab-btn" data-div="reservaA">Reserva A</button>
          <button class="tab-btn" data-div="reservaB">Reserva B</button>
        </div>
      </div>

      <div>
        <div class="btn-group-label">2. Seleccioná Tabla o Cruces</div>
        <div class="sub-tabs" id="subTabs"></div>
      </div>
    </section>

    <main class="board-card">
      <div class="status-bar">
        <span class="current-title" id="currentViewTitle">Primera A — Tabla Zona A</span>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="live-badge"><span class="dot"></span> En vivo</span>
          <span>Deslizá lateralmente en celular &rarr;</span>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="loader" id="loader">Cargando planilla oficial...</div>
        <iframe id="excelFrame" scrolling="no"></iframe>
      </div>
    </main>

    <footer>
      <p>Resultados oficiales sujetos a homologación del Tribunal de Disciplina.</p>
    </footer>
  </div>

  <script>
    const BASE_URL = "https://1drv.ms/x/c/b90d047e400182f5/IQTXrfcP4AjlRqM54eRwl4MLAcgV_COvlDoyNlF1P03_2bk?em=2&wdAllowInteractivity=False&Item=";
    const PARAMS = "&wdHideGridlines=True&wdInConfigurator=True";

    const DATA_VIEWS = {
      primeraA: [
        { label: "Tabla Zona A", sheet: "TABLA PRIMERA A ZONA A", height: 530, minWidth: 680 },
        { label: "Tabla Zona B", sheet: "TABLA PRIMERA A ZONA B", height: 530, minWidth: 680 },
        { label: "Cruces (Playoffs)", sheet: "CRUCES PRIMERA A", height: 780, minWidth: 920 }
      ],
      primeraB: [
        { label: "Tabla General", sheet: "TABLA PRIMERA B", height: 600, minWidth: 680 },
        { label: "Cruces", sheet: "CRUCES PRIMERA B", height: 480, minWidth: 620 }
      ],
      reservaA: [
        { label: "Tabla Zona A", sheet: "TABLA RESERVA A ZONA A", height: 510, minWidth: 680 },
        { label: "Tabla Zona B", sheet: "TABLA RESERVA A ZONA B", height: 510, minWidth: 680 },
        { label: "Cruces (Playoffs)", sheet: "CRUCES RESERVA A", height: 780, minWidth: 920 }
      ],
      reservaB: [
        { label: "Tabla General", sheet: "TABLA RESERVA B", height: 600, minWidth: 680 },
        { label: "Cruces", sheet: "CRUCES RESERVA B", height: 480, minWidth: 620 }
      ]
    };

    const DIVISION_NAMES = {
      primeraA: "Primera A",
      primeraB: "Primera B",
      reservaA: "Reserva A",
      reservaB: "Reserva B"
    };

    const divisionTabs = document.getElementById("divisionTabs");
    const subTabs = document.getElementById("subTabs");
    const excelFrame = document.getElementById("excelFrame");
    const currentViewTitle = document.getElementById("currentViewTitle");
    const loader = document.getElementById("loader");

    function buildEmbedUrl(sheetName) {
      const encodedItem = encodeURIComponent(`'${sheetName}'!Área_de_impresión`);
      return `${BASE_URL}${encodedItem}${PARAMS}`;
    }

    function loadSheet(divKey, index) {
      const item = DATA_VIEWS[divKey][index];

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.div === divKey);
      });
      document.querySelectorAll(".sub-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
      });

      currentViewTitle.textContent = `${DIVISION_NAMES[divKey]} — ${item.label}`;
      excelFrame.style.height = item.height + "px";
      excelFrame.style.minWidth = item.minWidth + "px";

      loader.classList.remove("hidden");
      excelFrame.src = buildEmbedUrl(item.sheet);
    }

    function renderSubButtons(divKey) {
      subTabs.innerHTML = "";
      DATA_VIEWS[divKey].forEach((view, idx) => {
        const btn = document.createElement("button");
        btn.className = "sub-btn" + (idx === 0 ? " active" : "");
        btn.textContent = view.label;
        btn.addEventListener("click", () => loadSheet(divKey, idx));
        subTabs.appendChild(btn);
      });
    }

    divisionTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      const divKey = btn.dataset.div;
      renderSubButtons(divKey);
      loadSheet(divKey, 0);
    });

    excelFrame.addEventListener("load", () => {
      loader.classList.add("hidden");
    });

    renderSubButtons("primeraA");
    loadSheet("primeraA", 0);
  </script>

</body>
</html>
